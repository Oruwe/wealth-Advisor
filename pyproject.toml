[project]
name = "wealth-advisor"
version = "0.1.0"
description = "Governed wealth-advisory agent: Lyzr agents for language, deterministic Python for portfolio math, policy rules for suitability."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "cvxpy>=1.9.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "lyzr-adk>=0.1.12",
    "numpy>=2.5.3",
    "pandas>=2.2.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "reportlab>=5.0.1",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.2",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax for the target Python
    "B",       # likely bugs
    "S",       # security (bandit)
    "DTZ",     # timezone-aware datetimes only
    "PTH",     # pathlib over os.path
    "T20",     # no print()
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]  # scripts talk to the terminal

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = [
    "error",
    # lyzr-adk 0.1.12 still declares its models with Pydantic V1-style validators and config.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:lyzr",
]

[tool.coverage.run]
branch = true
source = ["wealth_advisor"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
