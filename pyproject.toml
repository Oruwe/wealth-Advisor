[project]
name = "wealth-advisor"
version = "0.1.0"
description = "Governed wealth-advisory agent: Lyzr agents for language, deterministic Python for portfolio math, policy rules for suitability."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax for the target Python
    "B",       # likely bugs
    "S",       # security (bandit)
    "DTZ",     # timezone-aware datetimes only
    "PTH",     # pathlib over os.path
    "T20",     # no print()
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["wealth_advisor"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
